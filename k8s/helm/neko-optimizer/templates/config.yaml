apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "neko.name" . }}-config
  labels:
    {{- include "neko.labels" . | nindent 4 }}
data:
  DJANGO_ALLOWED_HOSTS: {{ .Values.host | quote }}
  SITE_URL: {{ printf "https://%s" .Values.host | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_HOST: {{ include "neko.name" . }}-postgres

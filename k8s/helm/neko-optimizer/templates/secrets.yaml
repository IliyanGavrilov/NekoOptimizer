{{- /*
The Secrets, generated by the chart itself - nothing secret is ever written in a values
file or in git. `lookup` reads the Secret already in the cluster, so an upgrade keeps
the first values: the database was initialised with that password, and a new key would
log every visitor out. "keep" leaves them in place even on `helm uninstall`, alongside
the database volume they unlock.
*/ -}}
{{- $name := include "neko.name" . -}}
{{- $db := lookup "v1" "Secret" .Release.Namespace (printf "%s-db" $name) -}}
{{- $django := lookup "v1" "Secret" .Release.Namespace (printf "%s-django" $name) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-db
  labels:
    {{- include "neko.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $db }}
  POSTGRES_PASSWORD: {{ index $db.data "POSTGRES_PASSWORD" }}
  {{- else }}
  POSTGRES_PASSWORD: {{ randAlphaNum 40 | b64enc }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-django
  labels:
    {{- include "neko.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $django }}
  DJANGO_SECRET_KEY: {{ index $django.data "DJANGO_SECRET_KEY" }}
  {{- else }}
  DJANGO_SECRET_KEY: {{ randAlphaNum 64 | b64enc }}
  {{- end }}
{{- if and .Values.ingress.enabled (not .Values.ingress.tlsSecret) }}
{{- $tls := lookup "v1" "Secret" .Release.Namespace (printf "%s-tls" $name) }}
---
# A self-signed HTTPS certificate for the host, made once and then reused.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-tls
  labels:
    {{- include "neko.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
  {{- if $tls }}
  tls.crt: {{ index $tls.data "tls.crt" }}
  tls.key: {{ index $tls.data "tls.key" }}
  {{- else }}
  {{- $cert := genSelfSignedCert .Values.host nil (list .Values.host) 365 }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  {{- end }}
{{- end }}

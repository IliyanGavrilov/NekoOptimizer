# What the two Secrets look like - for reading, NOT for applying. Real values never go in
# git: k8s/scripts/secrets.sh creates these objects in the cluster with random values.
# `stringData` takes plain text; Kubernetes stores it base64-encoded under `data`, which
# is an encoding, not encryption - anyone who may read Secrets in the namespace can
# decode it. Access is limited by RBAC (and, on a real cluster, encryption at rest).
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: neko
type: Opaque
stringData:
  # Hex only: it is pasted into the DATABASE_URL, where URL characters would break it.
  POSTGRES_PASSWORD: 0123456789abcdef0123456789abcdef
---
apiVersion: v1
kind: Secret
metadata:
  name: django
  namespace: neko
type: Opaque
stringData:
  DJANGO_SECRET_KEY: replace-with-50-random-characters

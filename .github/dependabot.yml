version: 2
# One PR a week for every bump, Python and Actions together: separate PRs edit
# neighbouring lines and each needs main's checks re-run once the other merges.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: pip
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: github-actions
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: dependencies

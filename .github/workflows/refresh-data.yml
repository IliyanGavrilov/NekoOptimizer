name: Refresh game data

# Once a day: re-fetch every version's catalogue, schedule and tier lists, and when any
# committed data changed, merge it through a pull request (Vercel redeploys on the merge)
# and import it into the live database. A day that brings nothing new ends after the fetch.
# Each job holds only what it needs: fetching parses third-party data with a read-only
# token, publishing gets write access, only the import sees the database, and a failure
# files an issue.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # One tarball per version feeds all four BCData-backed commands.
      - name: Fetch catalogues and schedules
        run: |
          curl -sSfL https://git.battlecatsmodding.org/fieryhenry/BCData/raw/metadata.json -o "$RUNNER_TEMP/metadata.json"
          for region in en jp tw kr; do
            url=$(python -c 'import json, sys; from neko.bcdata import latest_version, release_url; m = json.load(open(sys.argv[1])); r = sys.argv[2]; print(release_url(m, latest_version(m, r), r))' "$RUNNER_TEMP/metadata.json" "$region")
            curl -sSfL "$url" -o "$RUNNER_TEMP/$region.tar.xz"
            for command in fetch_units fetch_gamedata fetch_stats fetch_gacha; do
              python manage.py "$command" --region "$region" --tarball "$RUNNER_TEMP/$region.tar.xz"
            done
          done

      # Both scrape community sites that may turn a runner away; the day's data still lands.
      - name: Fetch the Cat Guide order and tier lists
        continue-on-error: true
        run: |
          python manage.py fetch_guide
          python manage.py fetch_tiers

      - name: Look for changes
        id: diff
        run: echo "changed=$(python .github/scripts/data_changed.py)" >> "$GITHUB_OUTPUT"

      # The golden seed proves the roll engine still matches godfat on the new data.
      - name: Tests
        if: steps.diff.outputs.changed != '0'
        run: pytest -q

      - uses: actions/upload-artifact@v7
        if: steps.diff.outputs.changed != '0'
        with:
          name: game-data
          path: neko/data
          retention-days: 3

  publish:
    needs: fetch
    if: needs.fetch.outputs.changed != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Pushes and PRs made with the workflow's own token trigger no workflows, and checks
    # dispatched by hand don't satisfy branch protection, so the PR never merged itself.
    # A personal token makes them ordinary events: the PR runs its checks like any other.
    env:
      GH_TOKEN: ${{ secrets.DATA_PR_TOKEN }}
    steps:
      - run: test -n "$GH_TOKEN" || { echo "::error::Add the DATA_PR_TOKEN repository secret."; exit 1; }

      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.DATA_PR_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          name: game-data
          path: neko/data

      - name: Open the data pull request
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c data-refresh
          git add neko/data
          git commit -m "Refresh game data"
          git push --force origin data-refresh
          if [ "$(gh pr view data-refresh --json state -q .state 2>/dev/null)" != "OPEN" ]; then
            gh pr create --base main --head data-refresh --title "Refresh game data" --body "The daily fetch found new game data. Merged automatically once the checks pass."
          fi
          echo "PR=$(gh pr view data-refresh --json url -q .url)" >> "$GITHUB_ENV"
          gh pr merge data-refresh --auto --squash --delete-branch

      # The import below must load what main now holds, so wait for the merge itself.
      - name: Wait for the merge
        timeout-minutes: 45
        run: |
          until [ "$(gh pr view "$PR" --json state -q .state)" = MERGED ]; do
            if gh pr checks "$PR" --required --json bucket -q '.[].bucket' | grep -q fail; then
              echo "::error::A required check failed on the data pull request."
              exit 1
            fi
            sleep 30
          done

  # Vercel's build applies migrations; this only loads the refreshed rows, from the main
  # the merge just produced - exactly what Vercel is deploying.
  import:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import into the live database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "::error::Add the DATABASE_URL repository secret."; exit 1; }
          for region in en jp tw kr; do
            python manage.py import_units --region "$region"
            python manage.py import_catalogue --region "$region"
            python manage.py reconcile_units --region "$region"
          done

  # A scheduled run fails silently unless someone opens Actions; an issue notifies the owner.
  report:
    needs: [fetch, publish, import]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: |
          issue=$(gh issue list --state open --search "Game data refresh failed in:title" --json number -q '.[0].number')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Failed again: $RUN"
          else
            gh issue create --title "Game data refresh failed" --body "The daily refresh failed: $RUN"
          fi

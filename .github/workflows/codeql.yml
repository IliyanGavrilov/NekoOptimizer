name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # the daily data refresh runs it on its pull request
  schedule:
    - cron: "30 6 * * 1" # weekly, offset from the Security workflow

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: python

      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4

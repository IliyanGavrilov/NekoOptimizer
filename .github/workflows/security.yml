name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # the daily data refresh runs it on its pull request
  schedule:
    - cron: "0 6 * * 1" # weekly, to catch CVEs disclosed after a merge

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      # pip-audit/bandit are CI-only tools, not app deps, so install them here
      # (Dependabot doesn't track them; the weekly run keeps the data fresh).
      - name: Install scanners
        run: pip install pip-audit bandit

      - name: Known CVEs in dependencies
        run: pip-audit -r requirements.txt

      - name: Python security lint
        run: bandit -r neko planner --skip B101 # B101 = asserts, used throughout tests

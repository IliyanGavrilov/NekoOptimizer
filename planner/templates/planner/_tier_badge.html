{% load i18n %}{% if badge %}<span class="tier-badge" data-band="{{ badge.tier.0 }}"{% if badge.uid is not None %} data-uid="{{ badge.uid }}" title="{% translate "See it in the tier list" %}"{% endif %}>{{ badge.tier }}{% if badge.up %}<span class="tier-up" title="{{ badge.up_note }}">&#9650;{{ badge.up }}</span>{% endif %}</span>{% endif %}

{% comment %}One collection cat chip. Rendered once per unit (see views.collection) and
reused in every view and gacha set it appears in.{% endcomment %}<span class="own-chip{% if unit.owned %} owned{% endif %}{% if unit.wanted %} wanted{% endif %}"
      data-pk="{{ unit.pk }}" data-uid="{{ unit.unit_id }}" data-name="{{ unit.name }}" data-forms="{{ unit.forms|join:'|' }}">
  <button type="button" class="chip chip-own icon-host" data-uid="{{ unit.unit_id }}"><span class="catname">{{ unit.name }}</span>{% include "planner/_tier_badge.html" with badge=unit.tier_badge %}</button>
  <button type="button" class="chip-star" title="Wishlist" aria-label="Toggle wishlist">&#9733;</button>
  <button type="button" class="catinfo" data-name="{{ unit.name }}" title="Forms &amp; wiki" aria-label="Cat details">&#9432;</button>
</span>

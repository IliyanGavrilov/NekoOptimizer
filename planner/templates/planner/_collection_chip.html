{% load i18n %}{% comment %}One collection cat chip. Rendered once per unit (see views.collection) and
reused in every view and gacha set it appears in.{% endcomment %}<span class="own-chip{% if unit.owned %} owned{% endif %}{% if unit.wanted %} wanted{% endif %}"
      data-pk="{{ unit.pk }}" data-uid="{{ unit.unit_id }}" data-rarity="{{ unit.rarity|default:"Unknown" }}" data-name="{{ unit.name }}" data-forms="{{ unit.forms|join:'|' }}">
  <button type="button" class="chip chip-own icon-host" data-uid="{{ unit.unit_id }}"><span class="catname">{{ unit.name }}</span>{% include "planner/_tier_badge.html" with badge=unit.tier_badge %}</button>
  <button type="button" class="chip-star" title="{% translate "Wishlist" %}" aria-label="{% translate "Toggle wishlist" %}"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.6l2.85 5.95 6.55.85-4.8 4.55 1.2 6.5L12 17.3l-5.8 3.15 1.2-6.5-4.8-4.55 6.55-.85z"/></svg></button>
  <button type="button" class="catinfo" data-uid="{{ unit.unit_id }}" data-name="{{ unit.name }}" title="{% translate "Forms & wiki" %}" aria-label="{% translate "Cat details" %}"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.25" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="12" cy="7.7" r="1.3" fill="currentColor"/><path d="M12 11v6.3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
</span>
